<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Voice Dictation Recorder</title>
    <style>
      :root {
        --color-bg: #ffffff;
        --color-surface: #f5f6f8;
        --color-border: #e0e3e8;
        --color-text: #16181d;
        --color-text-muted: #676d78;
        --color-primary: #2554e8;
        --color-primary-hover: #1c40b8;
        --color-success: #15803d;
        --color-success-bg: #eafbf0;
        --color-success-border: #b7ecc8;
        --color-error: #b91c1c;
        --color-error-bg: #fdecec;
        --color-recording: #d92d20;
        --color-recording-bg: #fdeeed;
        --radius-sm: 6px;
        --radius-md: 10px;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 480px;
        margin: 56px auto;
        padding: 0 24px 48px;
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-text);
        text-align: center;
      }

      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 4px;
      }

      .subtitle {
        font-size: 13px;
        color: var(--color-text-muted);
        margin: 0 0 26px;
      }

      .field-summary {
        text-align: left;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        margin-bottom: 30px;
      }

      .field-summary h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-muted);
        margin: 0 0 10px;
      }

      .field-summary-empty {
        margin: 0;
        font-size: 13px;
        color: var(--color-text-muted);
      }

      #field-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #field-list li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        font-size: 12.5px;
        color: var(--color-text);
      }

      #field-list li .check {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
        color: var(--color-success);
        display: none;
      }

      #field-list li.field-filled {
        border-color: var(--color-success-border);
        background: var(--color-success-bg);
        color: var(--color-success);
      }

      #field-list li.field-filled .check {
        display: inline-flex;
      }

      .record-button {
        position: relative;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: var(--color-primary);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        transition: background 0.15s ease;
        margin: 0 auto;
      }

      .record-button .icon {
        width: 32px;
        height: 32px;
      }

      .record-button:hover:not(:disabled) {
        background: var(--color-primary-hover);
      }

      .record-button:disabled {
        background: var(--color-border);
        color: var(--color-text-muted);
        cursor: not-allowed;
      }

      .record-button.is-recording {
        background: var(--color-recording);
      }

      .record-button.is-recording::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid var(--color-recording);
        animation: pulse-ring 1.6s ease-out infinite;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      #status {
        margin-top: 24px;
        display: inline-block;
        min-height: 18px;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        color: var(--color-text-muted);
      }

      #status.status-recording {
        color: var(--color-recording);
        background: var(--color-recording-bg);
      }

      #status.status-processing {
        color: var(--color-primary);
        background: #eaf0fe;
      }

      #status.status-success {
        color: var(--color-success);
        background: var(--color-success-bg);
      }

      #status.status-error {
        color: var(--color-error);
        background: var(--color-error-bg);
      }
    </style>
  </head>
  <body>
    <h1>Voice Dictation</h1>
    <p class="subtitle">Click record, speak the field values, then click stop.</p>

    <div class="field-summary" id="field-summary">
      <h2>This form has</h2>
      <ul id="field-list"></ul>
    </div>

    <button id="record-button" class="record-button">
      <svg
        id="icon-mic"
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"></path>
        <path d="M19 11a7 7 0 0 1-14 0"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
      </svg>
      <svg
        id="icon-stop"
        class="icon"
        viewBox="0 0 24 24"
        fill="currentColor"
        style="display: none"
      >
        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
      </svg>
      <span id="record-button-label">Record</span>
    </button>

    <div id="status"></div>
    <script src="recorder.js"></script>
  </body>
</html>
