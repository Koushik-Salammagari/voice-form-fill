<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form Field Detector - Settings</title>
    <style>
      :root {
        --color-bg: #ffffff;
        --color-border: #e0e3e8;
        --color-text: #16181d;
        --color-text-muted: #676d78;
        --color-primary: #2554e8;
        --color-primary-hover: #1c40b8;
        --color-success: #15803d;
        --color-success-bg: #eafbf0;
        --radius-sm: 6px;
        --radius-md: 10px;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-sans);
        max-width: 420px;
        margin: 48px auto;
        padding: 0 16px;
        color: var(--color-text);
        background: var(--color-bg);
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 20px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 13px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        margin-bottom: 10px;
      }
      input[type="password"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--color-primary);
      }
      button {
        padding: 8px 16px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        background: var(--color-primary);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      button:hover {
        background: var(--color-primary-hover);
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 500;
        color: var(--color-success);
        min-height: 14px;
      }
      .hint {
        font-size: 12px;
        color: var(--color-text-muted);
        margin-top: -4px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h2>AssemblyAI Dictation Settings</h2>
    <label for="api-key">AssemblyAI API key</label>
    <input
      type="password"
      id="api-key"
      placeholder="Paste your API key here"
      autocomplete="off"
    />
    <div class="hint">Stored locally on this device via chrome.storage.local.</div>
    <button id="save-button">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
