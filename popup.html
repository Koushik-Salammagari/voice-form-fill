<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form Field Detector</title>
    <style>
      :root {
        --color-bg: #ffffff;
        --color-text: #16181d;
        --color-text-muted: #676d78;
        --color-primary: #2554e8;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-text);
      }

      h1 {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-muted);
        margin: 0 0 10px;
      }

      p.hint {
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }

      .footer {
        margin-top: 14px;
        text-align: right;
      }

      .footer a {
        font-size: 11px;
        color: var(--color-text-muted);
        text-decoration: none;
      }

      .footer a:hover {
        color: var(--color-primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Voice Fill</h1>
    <p class="hint">
      Look for the recording panel in the bottom-right corner of any page to
      fill its form fields by voice.
    </p>
    <div class="footer"><a href="#" id="options-link">Settings</a></div>
    <script src="popup.js"></script>
  </body>
</html>
